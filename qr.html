<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Titans Devs Pair • QR Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      --bg: #07050a;
      --surface: rgba(18, 13, 22, 0.86);
      --surface-2: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.13);
      --accent: #ff4fb8;
      --accent-2: #ff8ed8;
      --text: #fff8fc;
      --muted: rgba(255,248,252,0.62);
      --shadow: 0 24px 80px rgba(0,0,0,0.45);
    }

    body.light {
      color-scheme: light;
      --bg: #fff7fb;
      --surface: rgba(255,255,255,0.88);
      --surface-2: rgba(22,12,19,0.05);
      --border: rgba(22,12,19,0.13);
      --text: #160c13;
      --muted: rgba(22,12,19,0.62);
      --shadow: 0 24px 70px rgba(255,79,184,0.18);
    }

    html { width: 100%; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at top left, rgba(255,79,184,0.26), transparent 32rem),
        radial-gradient(circle at bottom right, rgba(255,255,255,0.12), transparent 24rem),
        linear-gradient(135deg, var(--bg), #190d19);
      color: var(--text);
      font-family: 'Syne', system-ui, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(74px, 9vh, 96px) clamp(16px, 4vw, 32px) clamp(24px, 5vh, 42px);
      position: relative;
    }

    body.light { background: radial-gradient(circle at top left, rgba(255,79,184,0.2), transparent 32rem), linear-gradient(135deg, #fff7fb, #ffffff); }

    #bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: radial-gradient(circle, black, transparent 78%);
      pointer-events: none;
      z-index: 1;
    }

    .theme-toggle {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 6;
      width: 72px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 4px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .theme-toggle::before {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      left: 4px;
      top: 4px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transition: transform .25s ease;
      box-shadow: 0 10px 24px rgba(255,79,184,0.36);
    }

    body.light .theme-toggle::before { transform: translateX(34px); }
    .theme-toggle span { z-index: 1; font-size: 14px; text-align: center; }

    .wrapper {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: min(100%, 540px);
    }

    .badge {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(255,79,184,0.1);
      border: 1px solid rgba(255,79,184,0.24);
      padding: 8px 18px;
      border-radius: 100px;
      margin-bottom: 22px;
    }

    .brand { text-align: center; margin-bottom: 10px; }
    .brand-name { font-size: clamp(2.8rem, 13vw, 5.6rem); font-weight: 800; line-height: .88; letter-spacing: -0.08em; }
    .brand-name .accent { display: block; color: var(--accent); text-shadow: 0 0 40px rgba(255,79,184,0.35); }
    .brand-sub { font-family: 'DM Mono', monospace; font-size: clamp(10px, 2vw, 12px); color: var(--muted); letter-spacing: 4px; text-transform: uppercase; margin-top: 14px; }

    .divider { width: 72px; height: 1px; background: linear-gradient(90deg, transparent, var(--accent), transparent); margin: 26px auto; }

    .card {
      width: 100%;
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: clamp(22px, 6vw, 38px);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    .card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,79,184,0.13), transparent 42%); pointer-events: none; }
    .loading-area, .qr-area, .error-area { position: relative; z-index: 1; }

    .loading-area { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 34px 0; }
    .spinner-ring { width: 54px; height: 54px; border: 3px solid rgba(255,79,184,0.12); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; text-align: center; }

    .qr-area { display: none; flex-direction: column; align-items: center; width: 100%; gap: 22px; }
    .qr-frame { position: relative; padding: clamp(10px, 3vw, 16px); background: #fff; border-radius: 24px; box-shadow: 0 0 65px rgba(255,79,184,0.2); width: fit-content; max-width: 100%; }
    #qrImage { display: block; width: clamp(190px, 70vw, 280px); height: clamp(190px, 70vw, 280px); border-radius: 10px; }

    .status-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--accent); letter-spacing: 1px; text-align: center; line-height: 1.5; }

    .error-area { display: none; flex-direction: column; align-items: center; gap: 16px; padding: 30px 0; }
    .error-icon { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,80,130,0.09); border: 1px solid rgba(255,80,130,0.24); display: grid; place-items: center; font-size: 20px; color: #ff6b8f; }
    .error-text { font-family: 'DM Mono', monospace; font-size: 12px; color: #ff8faa; letter-spacing: 1px; text-align: center; line-height: 1.5; }
    .retry-btn { padding: 12px 26px; background: var(--text); border: 0; border-radius: 100px; color: var(--bg); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: transform 0.2s; }
    .retry-btn:hover { transform: translateY(-2px); }

    .back-link { margin-top: 28px; font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); letter-spacing: 1px; text-decoration: none; transition: color 0.2s; }
    .back-link:hover { color: var(--accent); }

    @media (max-width: 420px) {
      body { align-items: flex-start; }
      .brand-sub { letter-spacing: 2px; }
      .card { border-radius: 24px; }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Toggle dark and light mode" onclick="toggleTheme()"><span>☀</span><span>☾</span></button>
  <canvas id="bg-canvas"></canvas>

  <div class="wrapper">
    <div class="badge">QR Code</div>

    <div class="brand">
      <div class="brand-name">Titans<span class="accent">Devs Pair</span></div>
      <div class="brand-sub">WhatsApp Pairing Platform</div>
    </div>

    <div class="divider"></div>

    <div class="card">
      <div class="loading-area" id="loading">
        <div class="spinner-ring"></div>
        <div class="loading-text">Generating QR code…</div>
      </div>

      <div class="qr-area" id="qr-area">
        <div class="qr-frame">
          <img id="qrImage" src="" alt="WhatsApp QR Code">
        </div>
        <div class="status-text" id="status"></div>
      </div>

      <div class="error-area" id="error-area">
        <div class="error-icon">✕</div>
        <div class="error-text" id="error-msg">Failed to load QR code</div>
        <button class="retry-btn" onclick="loadQRCode()">Retry</button>
      </div>
    </div>

    <a class="back-link" href="/">← back to home</a>
  </div>

  <script>
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'light') document.body.classList.add('light');

    function toggleTheme() {
      document.body.classList.toggle('light');
      localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
    }

    async function loadQRCode() {
      const loading = document.getElementById('loading');
      const qrArea = document.getElementById('qr-area');
      const errorArea = document.getElementById('error-area');

      loading.style.display = 'flex';
      qrArea.style.display = 'none';
      errorArea.style.display = 'none';

      try {
        const res = await fetch('/qr');
        const data = await res.json();

        if (data.qr) {
          document.getElementById('qrImage').src = data.qr;
          document.getElementById('status').textContent = data.message || 'Scan with WhatsApp';
          loading.style.display = 'none';
          qrArea.style.display = 'flex';
        } else {
          throw new Error(data.code || 'No QR data');
        }
      } catch (err) {
        document.getElementById('error-msg').textContent = err.message || 'Error fetching QR code';
        loading.style.display = 'none';
        errorArea.style.display = 'flex';
      }
    }

    loadQRCode();

    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, nodes = [], animId;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function initNodes() {
      nodes = [];
      const count = Math.min(Math.floor((W * H) / 18000), 52);
      for (let i = 0; i < count; i++) {
        nodes.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25, r: Math.random() * 1.5 + 0.5, opacity: Math.random() * 0.34 + 0.1 });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      for (let i = 0; i < nodes.length; i++) {
        const a = nodes[i];
        a.x += a.vx; a.y += a.vy;
        if (a.x < 0 || a.x > W) a.vx *= -1;
        if (a.y < 0 || a.y > H) a.vy *= -1;
        for (let j = i + 1; j < nodes.length; j++) {
          const b = nodes[j];
          const dx = a.x - b.x, dy = a.y - b.y, dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 140) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255,79,184,${(1 - dist / 140) * 0.1})`;
            ctx.lineWidth = 0.5;
            ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
        ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(255,79,184,${a.opacity})`; ctx.fill();
      }
      animId = requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { cancelAnimationFrame(animId); resize(); initNodes(); draw(); });
    resize(); initNodes(); draw();
  </script>
</body>
</html>
